# Installs the three entry scripts as commands of the same names without ".py",
# for pip, pipx and Nix's buildPythonApplication. Everything installs under one
# package, speaker_tuning_to_easyeffects/, holding the scripts and lib/, so no
# generic top-level `lib` can collide with another distribution's;
# lib/launch.py puts that folder on sys.path so the code imports as in a clone.
# `version` is bumped when a release is cut, and release.yml fails on a tag it
# doesn't match. The runtime --version comes from lib/version.py instead, which
# also knows the commits since the tag: the build stamps it (below), and a
# build with no git to ask reports this `version` marked "+unstamped".
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-tuning-to-easyeffects"
version = "2026.10.1"
description = "Convert the speaker tuning in Windows audio drivers (Dolby, Surface, Sonitude) into EasyEffects presets or a PipeWire filter chain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# lib/packages.py MIN_PYTHON; tests/test_packaging.py keeps the two in step.
requires-python = ">=3.9"
# rich, rich-argparse (color) and argcomplete (tab completion) install by
# default, though the code only soft-imports them (lib/console.py and the entry
# scripts) and runs monochrome without completion when they're absent. Extras
# are opt-in only, so leaving these out is the opt-out: a packager can drop
# them from its derivation, or `pip install --no-deps` with numpy and scipy
# alone.
# tests/test_packaging.py keeps these lists in step with requirements.txt.
dependencies = ["numpy", "scipy", "rich", "rich-argparse", "argcomplete"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist>=3.2"]

[project.urls]
Homepage = "https://github.com/antoinecellerier/speaker-tuning-to-easyeffects"

[project.scripts]
dolby_to_easyeffects = "speaker_tuning_to_easyeffects.lib.launch:dolby_to_easyeffects"
dolby_to_pipewire = "speaker_tuning_to_easyeffects.lib.launch:dolby_to_pipewire"
ee_to_pipewire = "speaker_tuning_to_easyeffects.lib.launch:ee_to_pipewire"

# The repo root maps to the package, so the package holds the three scripts
# (the root's only .py files, tests/test_layout.py) and lib/. The subpackages
# are listed by hand, because the package finder can't add the prefix;
# tests/test_packaging.py fails on one missing. No package data: mapping the
# root would otherwise sweep README, tests/ and tools/ into the wheel.
[tool.setuptools]
include-package-data = false
packages = [
    "speaker_tuning_to_easyeffects",
    "speaker_tuning_to_easyeffects.lib",
    "speaker_tuning_to_easyeffects.lib.apo",
    "speaker_tuning_to_easyeffects.lib.data",
    "speaker_tuning_to_easyeffects.lib.dax",
    "speaker_tuning_to_easyeffects.lib.hardware",
    "speaker_tuning_to_easyeffects.lib.pipewire",
    "speaker_tuning_to_easyeffects.lib.preset",
    "speaker_tuning_to_easyeffects.lib.report",
]

[tool.setuptools.package-dir]
"speaker_tuning_to_easyeffects" = "."
"speaker_tuning_to_easyeffects.lib" = "lib"

# Stamps `git describe` into the built copy of lib/version.py, so an install
# from a clone reports its commit: tools/packaging/stamp_version.py. Resolved
# by file path from this directory, so tools/ needn't be importable or
# installed; MANIFEST.in carries the file into an sdist.
[tool.setuptools.cmdclass]
build_py = "tools.packaging.stamp_version.BuildPy"
sdist = "tools.packaging.stamp_version.Sdist"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# -n auto fans every run across cores (fast tier 95s -> 36s here). Safe to set
# globally: xdist's own worker bootstrap resets numprocesses to None and dist to
# "no" (xdist/remote.py setup_config), so workers never spawn workers, and it
# drops to serial by itself under --pdb. Do NOT reimplement this as a conftest
# hook that sets config.option.numprocesses — one that runs after that reset
# undoes it, and each worker then spawns its own. Pass -n 0 to force serial.
# --dist worksteal, not the default load: load hands each worker a run of
# neighbouring tests up front, the slow ones sit together in a few files, and
# the other workers then idle behind them (fast tier 110s -> 75s here).
addopts = "-ra -n auto --dist worksteal"
markers = [
    "live_machine: asks this machine's real tools (lv2info, pw-dump, …) instead of the default where every tool looks uninstalled; see lib/tool_env.py. Skip where the tool is absent.",
    "slow: expensive test (e.g. the ee_to_pipewire corpus tier, which runs every distinct discovered XML's PW conf through lv2info). Skipped unless --run-slow or ATMOS_RUN_SLOW=1.",
]
