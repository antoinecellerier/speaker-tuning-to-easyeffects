[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# -n auto fans every run across cores (fast tier 95s -> 36s here). Safe to set
# globally: xdist's own worker bootstrap resets numprocesses to None and dist to
# "no" (xdist/remote.py setup_config), so workers never spawn workers, and it
# drops to serial by itself under --pdb. Do NOT reimplement this as a conftest
# hook that sets config.option.numprocesses — one that runs after that reset
# undoes it, and each worker then spawns its own. Pass -n 0 to force serial.
# --dist worksteal, not the default load: load hands each worker a run of
# neighbouring tests up front, the slow ones sit together in a few files, and
# the other workers then idle behind them (fast tier 110s -> 75s here).
addopts = "-ra -n auto --dist worksteal"
markers = [
    "live_tools: asks this machine's real tools (lv2info, pw-dump, …) instead of the default where every tool looks uninstalled; see lib/tool_env.py. Skip where the tool is absent.",
    "slow: expensive test (e.g. the ee_to_pipewire corpus tier, which runs every distinct discovered XML's PW conf through lv2info). Skipped unless --run-slow or ATMOS_RUN_SLOW=1.",
]
