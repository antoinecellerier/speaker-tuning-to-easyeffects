name: Kernel sound-tree watch

# Weekly watcher for Takashi Iwai's sound.git pull tags (sound-X.Y-rcN,
# sound-fix-X.Y-rcN, …). Each tag's annotation is the canonical pull-request
# text Linus receives, so it's the highest-signal changelog for laptop audio
# quirks. For every tag not seen before, this posts a comment on the
# "kernel-sound-watch"-labeled tracking issue: watchlist grep hits
# (.github/kernel-watchlist.txt) up top, full pull text folded below.
# Judgment about whether a hit matters for an open issue stays with humans
# (or a Claude session) reading the comment — nothing here needs an API key.
#
# State (which tags have been processed) lives in a machine-edited comment on
# the tracking issue itself, found by the <!-- kernel-watch-state --> marker
# line. That keeps the workflow at `issues: write` only — its token cannot
# touch repo contents, so there is no writable branch to secure. The tag list
# is rendered readably (folded `<details>`, one tag per line) so a human can
# glance at what has been checked; parsing just greps whole lines matching
# `sound-*`, so it needs no delimiters and does not care about the wrapper.
# First run bootstraps: it records all currently-published tags (~500) and
# alerts on nothing, so enabling the workflow never floods the issue with
# history.
#
# Tag listing uses git.kernel.org (authoritative); the per-tag fetch uses the
# kernel.googlesource.com mirror because it honors partial-clone filters
# (~100KB per fetch vs ~280MB from kernel.org, which ignores --filter). If
# the mirror lags a fresh tag, the fetch fails and the tag is retried on the
# next run — it is only marked seen after a successful post.

on:
  schedule:
    - cron: '23 6 * * 1'  # Mondays 06:23 UTC — pulls land ~weekly at most
  workflow_dispatch:

concurrency:
  group: kernel-sound-watch
  cancel-in-progress: false

permissions:
  contents: read  # checkout, for the watchlist file
  issues: write   # create/comment on the tracking issue + edit the state comment

env:
  SOUND_GIT: https://git.kernel.org/pub/scm/linux/kernel/git/tiwai/sound.git
  FETCH_GIT: https://kernel.googlesource.com/pub/scm/linux/kernel/git/tiwai/sound
  ISSUE_LABEL: kernel-sound-watch
  WATCHLIST: .github/kernel-watchlist.txt
  # Fingerprint that identifies the state comment. Kept as a bare prefix (no
  # closing `-->`) so it also matches a comment left in the older layout, where
  # the marker opened an HTML comment that swallowed the whole tag list.
  STATE_MARKER: "<!-- kernel-watch-state"
  GH_TOKEN: ${{ github.token }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Detect new sound tags
        id: detect
        run: |
          git ls-remote --tags "$SOUND_GIT" 'sound-*' \
            | awk '{print $2}' | grep -v '\^{}$' | sed 's|^refs/tags/||' \
            | sort -u > current-tags.txt

          num=$(gh issue list --label "$ISSUE_LABEL" --state open \
                  --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh label create "$ISSUE_LABEL" \
              --description "Automated watch of the kernel sound tree" \
              --color 5319e7 || true
            num=$(gh issue create \
              --title "Kernel sound-tree watch" \
              --label "$ISSUE_LABEL" \
              --body "$(printf '%s\n' \
                "Automated tracking issue: the kernel-sound-watch workflow posts one comment per new pull tag on [tiwai/sound.git](https://git.kernel.org/pub/scm/linux/kernel/git/tiwai/sound.git), with grep hits against [the watchlist](https://github.com/$GITHUB_REPOSITORY/blob/master/.github/kernel-watchlist.txt) highlighted." \
                "" \
                "Keep the watchlist current when opening/closing device investigations (see CLAUDE.md). Close this issue to retire the watch (the workflow recreates it if it runs again). The machine-written comment below is the workflow's state — it lists every tag already processed, so you can check whether one was seen; leave it alone otherwise.")" \
              | grep -oE '[0-9]+$')
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

          sid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments" --paginate \
                  --jq ".[] | select(.user.login == \"github-actions[bot]\")
                            | select(.body | contains(\"$STATE_MARKER\")) | .id" \
                | head -n1)
          echo "state_id=$sid" >> "$GITHUB_OUTPUT"
          if [ -n "$sid" ]; then
            # Whole-line tag match, not a delimited slice: independent of how the
            # list is wrapped for display. The prose around it must never leave a
            # bare tag alone on a line (backticks in the summary keep it safe).
            # The leading path segment is not slop: the tree really carries a
            # refs/tags/tags/sound-sdw-kconfig-fixes, and dropping it here would
            # re-post that tag on every run, since it could never be recorded.
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$sid" --jq .body \
              | tr -d '\r' \
              | grep -E '^[A-Za-z0-9._+/-]*sound-[A-Za-z0-9._+-]+$' \
              | sort -u > seen-tags.txt
            if [ ! -s seen-tags.txt ]; then
              # Treating this as "nothing seen" would post a comment per published
              # tag (~500). Fail loudly instead — the comment or the parse is broken.
              echo "::error::state comment $sid parsed to zero tags — refusing to re-bootstrap"
              exit 1
            fi
          else
            # Bootstrap: mark everything published so far as seen, alert on nothing.
            cp current-tags.txt seen-tags.txt
          fi

          comm -13 seen-tags.txt current-tags.txt > new-tags.txt
          : > posted-tags.txt
          echo "count=$(wc -l < new-tags.txt)" >> "$GITHUB_OUTPUT"
          echo "New tags:"; cat new-tags.txt

      - name: Post one comment per new tag
        if: steps.detect.outputs.count != '0'
        env:
          ISSUE_NUMBER: ${{ steps.detect.outputs.number }}
        run: |
          grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' "$WATCHLIST" > patterns.txt
          git init -q soundtree
          while IFS= read -r tag; do
            # Tag annotation only — the mirror honors --filter, so this is tiny.
            if ! git -C soundtree fetch -q --depth=1 --filter=tree:0 \
                   "$FETCH_GIT" "+refs/tags/$tag:refs/tags/$tag"; then
              echo "::warning::fetch failed for $tag (mirror lag?) — will retry next run"
              continue
            fi
            git -C soundtree tag -l --format='%(contents)' "$tag" \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > msg.txt
            [ -s msg.txt ] || echo "(no tag annotation)" > msg.txt
            hits=$(grep -i -F -f patterns.txt msg.txt || true)
            {
              echo "## New sound-tree tag: [\`$tag\`]($SOUND_GIT/tag/?h=$tag)"
              echo
              echo "[Tag + pull text]($SOUND_GIT/tag/?h=$tag) · [commit log]($SOUND_GIT/log/?h=$tag) · [lore thread](https://lore.kernel.org/lkml/?q=$tag)"
              echo
              if [ -n "$hits" ]; then
                echo '### :rotating_light: Watchlist hits'
                echo '```'
                echo "$hits"
                echo '```'
              else
                echo '_No watchlist hits._'
              fi
              echo
              echo '<details><summary>Full pull-request text</summary>'
              echo
              echo '```'
              cat msg.txt
              echo '```'
              echo '</details>'
              echo
              echo "_Posted by the kernel-sound-watch workflow. Terms: [\`$WATCHLIST\`](https://github.com/$GITHUB_REPOSITORY/blob/master/$WATCHLIST)._"
            } > comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file comment.md
            echo "$tag" >> posted-tags.txt
          done < new-tags.txt

      # Runs every time, not just when tags landed: it refreshes "last checked"
      # on quiet weeks, and migrates a pre-existing state comment to this layout.
      - name: Update state comment
        env:
          ISSUE_NUMBER: ${{ steps.detect.outputs.number }}
          STATE_ID: ${{ steps.detect.outputs.state_id }}
        run: |
          sort -u seen-tags.txt posted-tags.txt > state-tags.txt
          # -V for display only; seen-tags.txt stays plain-sorted for `comm` above.
          {
            echo "Machine-written watch state — sound-tree tags already processed. Do not edit."
            echo
            # No "newest tag" here: sort order can't supply one honestly —
            # `sound-fix-*` and the stray `tags/…` ref both sort after any
            # version-numbered tag regardless of vintage.
            echo "$(wc -l < state-tags.txt) tags processed · last checked $(date -u +%Y-%m-%d)"
            echo
            echo "$STATE_MARKER -->"
            echo "<details><summary>Show the full list</summary>"
            echo
            echo '```'
            sort -V state-tags.txt
            echo '```'
            echo
            echo '</details>'
          } > state.md
          if [ -n "$STATE_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$STATE_ID" \
              -F body=@state.md > /dev/null
          else
            gh issue comment "$ISSUE_NUMBER" --body-file state.md
          fi
