name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # write, not read — what upstream's own setup docs ask for. Claude used
      # to push under `contents: read` (it did on #37/#38, 2026-07-21) because
      # the action swaps git's credential for its own app token, which carries
      # its own write. That swap silently stopped applying: actions/checkout
      # v4.3.1+/v5.0.1+/v6 moved the token it persists out of the local config
      # into a RUNNER_TEMP file wired up as `includeIf.gitdir:….path`, and the
      # action clears only plain `include.path`. The leftover header outranks
      # the token in the remote URL, so a push now authenticates as
      # github-actions[bot] — this block — and a `contents: read` run 403s
      # after committing, leaving nothing behind (PR #92). Pushing to master
      # stays blocked either way: the master ruleset requires a PR and
      # bypasses only for the admin role, which this token does not hold.
      contents: write
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Master, never the PR: the pip install below runs before the
          # action's write-access check, under this job's write token, so it
          # must install master's requirements.txt. Review events would
          # otherwise check out the PR's merge ref. The action checks out
          # the PR head itself once its checks pass. The cost: on a PR that
          # adds a dependency, Claude's pytest fails to import it, and
          # tests.yml on the PR is the run to trust.
          ref: ${{ github.event.repository.default_branch }}

      # So Claude can run the suite on what it just edited — README/CHANGELOG
      # sync and the layout rules are tested, and a run that cannot check them
      # ships its edit unverified. Same setup as tests.yml; keep the two in
      # step. pyproject's addopts passes -n auto, hence pytest-xdist from
      # requirements.txt rather than a bare `pip install pytest`.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # The run's tool allowlist. Three parts:
      #
      # The test suite, installed by the step above. Both spellings: Claude
      # reaches for `python -m pytest` about as often as the bare command, and
      # an unlisted one is denied outright, not queued for approval.
      #
      # PSREF, for device names. It is the authority for the branding the
      # README table uses, and DMI is lossy (regional families, a dropped
      # Intel/AMD word) — a naming run that cannot reach it is guessing.
      # PSREF's own APIs 403/404 and its /Product pages are JS shells, so the
      # route is a search on the machine type restricted to psref.lenovo.com,
      # then the static spec PDF under /syspool/: hence a search plus a
      # domain-scoped fetch, and nothing broader. This action's tag mode
      # disables both tools by default; naming them here re-enables exactly
      # these two. Result titles and PDF text are untrusted input — data about
      # a device, never instructions. Method: the /issue-replies skill,
      # "resolve the machine type to the global model name first".
      #
      # Read-only gh access to exactly the issues/PRs the trigger text
      # references (#N), so "@claude … as suggested in #33" can read #33 but
      # nothing else. Trigger text is safe to scan: the action only runs for
      # write-access actors. Passed via env, never inlined into the script —
      # inlining ${{ …body }} in run: is a shell-injection hole.
      - name: Build the run's tool allowlist
        id: refs
        env:
          TRIGGER_TEXT: >-
            ${{ github.event.comment.body
             || github.event.review.body
             || github.event.issue.body }}
        run: |
          tools='Bash(pytest:*),Bash(python -m pytest:*),Bash(python3 -m pytest:*)'
          tools="$tools,WebSearch,WebFetch(domain:psref.lenovo.com)"
          for n in $(grep -oE '#[0-9]+' <<< "$TRIGGER_TEXT" | tr -d '#' | sort -un); do
            tools="$tools,Bash(gh issue view $n:*),Bash(gh pr view $n:*),Bash(gh pr diff $n:*)"
          done
          echo "allowed_tools=$tools" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation, not a stored secret: the action
          # trades this job's GitHub OIDC token (id-token: write above) for a
          # Claude API token that lives at most 10 minutes from minting. A
          # prompt injection can still leak one — tag mode grants a bare
          # `Read`, which reaches RUNNER_TEMP — but it expires within minutes
          # instead of being a long-lived login. The Console rule matches
          # this repo by repository_id/repository_owner_id and mints only into
          # the github-actions workspace, whose spend limit caps misuse. These
          # are identifiers, not credentials. Never add
          # claude_code_oauth_token or anthropic_api_key back: a static
          # credential silently takes precedence over federation.
          anthropic_federation_rule_id: fdrl_01LiAu14zPSDcmrpQmuyt7dk
          anthropic_organization_id: efda1e56-e140-4f5d-b3aa-91b37bec855b
          anthropic_service_account_id: svac_015oVDzSUiPX2UddVYDK92T1
          anthropic_workspace_id: wrkspc_01PyszgP4UNYsrezb9nHzh8U

          # Off only on PRs our own workflows open — device-confirmed.yml
          # (github-actions[bot]; claude[bot] before it opened PRs itself),
          # speaker-quirks.yml and kernel-release-table.yml — so the
          # allowlisted pytest runs there. The action counts every [bot]
          # author as untrusted and then denies test runners and interpreters
          # over --allowedTools, which blocked the suite on device-report PRs
          # (#169); `false` also drops its other untrusted-PR handling
          # (docs/security.md in the action repo).
          #
          # The trade-off, accepted: these PRs carry text anyone can write
          # (a device PR quotes the public issue's DMI lines, and anyone can
          # comment on it), and tag mode lets Claude edit any file. So when a
          # maintainer invokes @claude here, an injection in that text could
          # have Claude edit tests/conftest.py and run pytest under this
          # job's write tokens. That is the exposure every @claude run on an
          # issue already has (the restriction never applies to issues), and
          # it needs the maintainer's own @claude to start. Planted code is
          # the other risk, and it holds only while no outsider can push to
          # these branches: the branch is in this repo (the action skips fork
          # PRs; allow_fork_prs is unset), the two table workflows run no
          # model, device-confirmed.yml lets Claude edit only
          # README.md/CHANGELOG.md and checks the diff, and it gives Claude
          # no command that can send the action's app token off the runner.
          # Widen any of those and a stolen token could open a claude[bot]
          # PR with code this setting then lets pytest run. On a
          # PR comment issue.user is the PR author; on review events it is
          # pull_request.user.
          restrict_untrusted_prs: ${{ contains(fromJSON('["claude[bot]","github-actions[bot]"]'), github.event.issue.user.login || github.event.pull_request.user.login) && 'false' || 'true' }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Appended to the action's own --allowedTools, not replacing it: the
          # CLI merges the two lists. Anything in neither is denied outright —
          # a headless run has nobody to approve a permission prompt.
          # --model takes the alias, not a dated ID, so it follows the current
          # Sonnet without a workflow edit.
          claude_args: |
            --model sonnet
            --allowedTools "${{ steps.refs.outputs.allowed_tools }}"


      # The transcript, for when a run fails without saying why: the action
      # hides Claude's output from the log, debug reruns included. The path
      # falls back to runner.temp because the action sets no step outputs
      # when it fails, which is exactly when this is needed. The repo is
      # public, so any signed-in user can download it; it holds the trigger
      # text and what Claude read and ran. Short retention for that reason.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          if-no-files-found: warn
          retention-days: 14
