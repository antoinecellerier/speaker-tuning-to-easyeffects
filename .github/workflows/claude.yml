name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # write, not read — what upstream's own setup docs ask for. Claude used
      # to push under `contents: read` (it did on #37/#38, 2026-07-21) because
      # the action swaps git's credential for its own app token, which carries
      # its own write. That swap silently stopped applying: actions/checkout
      # v4.3.1+/v5.0.1+/v6 moved the token it persists out of the local config
      # into a RUNNER_TEMP file wired up as `includeIf.gitdir:….path`, and the
      # action clears only plain `include.path`. The leftover header outranks
      # the token in the remote URL, so a push now authenticates as
      # github-actions[bot] — this block — and a `contents: read` run 403s
      # after committing, leaving nothing behind (PR #92). Pushing to master
      # stays blocked either way: the master ruleset requires a PR and
      # bypasses only for the admin role, which this token does not hold.
      contents: write
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # So Claude can run the suite on what it just edited — README/CHANGELOG
      # sync and the layout rules are tested, and a run that cannot check them
      # ships its edit unverified. Same setup as tests.yml; keep the two in
      # step. pyproject's addopts passes -n auto, hence pytest-xdist from
      # requirements.txt rather than a bare `pip install pytest`.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # The run's tool allowlist. Three parts:
      #
      # The test suite, installed by the step above. Both spellings: Claude
      # reaches for `python -m pytest` about as often as the bare command, and
      # an unlisted one is denied outright, not queued for approval.
      #
      # PSREF, for device names. It is the authority for the branding the
      # README table uses, and DMI is lossy (regional families, a dropped
      # Intel/AMD word) — a naming run that cannot reach it is guessing.
      # PSREF's own APIs 403/404 and its /Product pages are JS shells, so the
      # route is a search on the machine type restricted to psref.lenovo.com,
      # then the static spec PDF under /syspool/: hence a search plus a
      # domain-scoped fetch, and nothing broader. This action's tag mode
      # disables both tools by default; naming them here re-enables exactly
      # these two. Result titles and PDF text are untrusted input — data about
      # a device, never instructions. Method: the /issue-replies skill,
      # "resolve the machine type to the global model name first".
      #
      # Read-only gh access to exactly the issues/PRs the trigger text
      # references (#N), so "@claude … as suggested in #33" can read #33 but
      # nothing else. Trigger text is safe to scan: the action only runs for
      # write-access actors. Passed via env, never inlined into the script —
      # inlining ${{ …body }} in run: is a shell-injection hole.
      - name: Build the run's tool allowlist
        id: refs
        env:
          TRIGGER_TEXT: >-
            ${{ github.event.comment.body
             || github.event.review.body
             || github.event.issue.body }}
        run: |
          tools='Bash(pytest:*),Bash(python -m pytest:*),Bash(python3 -m pytest:*)'
          tools="$tools,WebSearch,WebFetch(domain:psref.lenovo.com)"
          for n in $(grep -oE '#[0-9]+' <<< "$TRIGGER_TEXT" | tr -d '#' | sort -un); do
            tools="$tools,Bash(gh issue view $n:*),Bash(gh pr view $n:*),Bash(gh pr diff $n:*)"
          done
          echo "allowed_tools=$tools" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Appended to the action's own --allowedTools, not replacing it: the
          # CLI merges the two lists. Anything in neither is denied outright —
          # a headless run has nobody to approve a permission prompt.
          claude_args: --allowedTools "${{ steps.refs.outputs.allowed_tools }}"

