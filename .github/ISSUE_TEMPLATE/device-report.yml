name: Device report
description: Report what works or doesn't on your hardware
title: "<replace with your device name>"
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting your experience. It really helps improve the project!
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Brand, model, and machine-type code if you have one
    validations:
      required: true
  - type: textarea
    id: speaker-info
    attributes:
      label: "`--speaker-info` or `--doctor` output"
      description: >-
        Run `python3 dolby_to_easyeffects.py --speaker-info` and paste the whole block.
        If you're reporting a problem, run `python3 dolby_to_easyeffects.py --doctor`
        instead, which includes more diagnostics.
        Using the PipeWire filter-chain instead of EasyEffects? Pass the same
        flags to `dolby_to_pipewire.py`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: xml-source
    attributes:
      label: Where did you get the tuning XML, and did the script auto-detect it?
      placeholder: |
        Auto-detected from my mounted Windows partition
        — or — Extracted the driver package
        — or — Passed the XML path manually
    validations:
      required: true
  - type: textarea
    id: generation-output
    attributes:
      label: Preset-generation output
      description: >-
        Leave this empty if you're just reporting things are working well.
        For a sound-quality problem, re-run the command that wrote your
        presets with `-v` and paste its full output.
        For example: `python3 dolby_to_easyeffects.py -v --autoload`.
        The verbose run includes the frequency tables a diagnosis needs, on
        top of the tuning values derived from your XML.
        Using the PipeWire filter-chain instead? Run
        `python3 dolby_to_pipewire.py -v --dry-run`.
        It reports without reinstalling anything.
      placeholder: |
        Leave this empty if you're just reporting things are working well.
      render: shell
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: How does it sound? Anything else?
      description: >-
        Profiles you used, quality vs. the Windows Dolby app, and any fix you
        needed, such as a smart-amp firmware gate, manual autoload or distro
        quirk.
    validations:
      required: false
