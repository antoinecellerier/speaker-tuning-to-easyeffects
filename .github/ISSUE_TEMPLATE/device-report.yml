name: Device report
description: Report what works or doesn't on your hardware
title: "<replace with your device name>"
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report your experience ... it really helps improve the project!
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Brand, model, and machine-type code (if you have one)
    validations:
      required: true
  - type: textarea
    id: speaker-info
    attributes:
      label: "`--speaker-info` or `--doctor` output"
      description: >-
        Run `python3 dolby_to_easyeffects.py --speaker-info` and paste the whole block.
        If reporting a problem, run `python3 dolby_to_easyeffects.py --doctor` instead
        to include more diagnostics.
        (Using the PipeWire filter-chain instead of EasyEffects? Same flags on
        `dolby_to_pipewire.py`.)
      render: shell
    validations:
      required: true
  - type: textarea
    id: xml-source
    attributes:
      label: Where did you get the tuning XML, and did the script auto-detect it?
      placeholder: |
        Auto-detected from my mounted Windows partition
        — or — Extracted the driver package
        — or — Passed the XML path manually
    validations:
      required: true
  - type: textarea
    id: generation-output
    attributes:
      label: Preset-generation output
      description: >-
        Leave this empty if you're just reporting things are working well.
        If you're reporting a sound-quality problem, paste the full output of
        the run that wrote the presets, re-run with `-v` (e.g. `python3
        dolby_to_easyeffects.py -v --autoload`) — the verbose run includes
        the frequency tables a diagnosis needs on top of the tuning values
        derived from your XML.
        (Using the PipeWire filter-chain instead? `python3
        dolby_to_pipewire.py -v --dry-run` — it reports without reinstalling
        anything.)
      placeholder: |
        Leave this empty if you're just reporting things are working well.
      render: shell
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: How does it sound? Anything else?
      description: >-
        Profiles you used, quality vs. the Windows Dolby app, and any fix you
        needed (smart-amp firmware gate, manual autoload, distro quirk).
    validations:
      required: false
